name: Deploy to HuggingFace Space

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'models.py'
      - 'Dockerfile'
      - 'README.md'
      - 'openenv.yaml'
      - 'pyproject.toml'
      - '.github/workflows/push-to-hf.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openenv-core

      - name: Configure HuggingFace credentials
        run: |
          hf auth login --token ${{ secrets.HF_TOKEN }} --add-to-git-credentials

      - name: Push to HuggingFace Space
        run: |
          openenv push --repo-id sushere/ux-insight-env --interface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Successfully deployed to HuggingFace Space"
          echo "Space URL: https://huggingface.co/spaces/sushere/ux-insight-env"

      - name: Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to HuggingFace failed"
          echo "Check the logs above for details"
          exit 1
