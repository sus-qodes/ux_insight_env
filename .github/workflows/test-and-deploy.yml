name: Test, Build Docker & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'models.py'
      - 'Dockerfile'
      - 'README.md'
      - 'openenv.yaml'
      - 'pyproject.toml'
      - '.github/workflows/test-and-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test_result.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run test suite
        id: test_result
        run: |
          pytest server/tests/test_grader.py -v --tb=short
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Validate imports
        run: |
          python -c "from server.environment import UXInsightEnvironment; from server.rubrics import UXAnalystRubric; from server.grader import grade_step; print('✓ All imports valid')"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            server/tests/

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ux-insight-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (for testing)
        run: |
          docker build -t ux-insight-env:test .

      - name: Test Docker image
        run: |
          # Start the container in the background
          docker run -d -p 7860:7860 --name ux-insight-test ux-insight-env:test

          # Wait for service to be ready
          sleep 5

          # Test health endpoint
          if curl -f http://localhost:7860/health; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            docker logs ux-insight-test
            exit 1
          fi

          # Cleanup
          docker stop ux-insight-test
          docker rm ux-insight-test

      - name: Docker build success
        run: |
          echo "✅ Docker image built and tested successfully"

  deploy:
    needs: [test, build-docker]
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OpenEnv
        run: |
          python -m pip install --upgrade pip
          pip install openenv-core

      - name: Configure HuggingFace credentials
        run: |
          huggingface-cli login --token ${{ secrets.HF_TOKEN }} --add-to-git-credentials

      - name: Push to HuggingFace Space
        run: |
          openenv push --repo-id sushere/ux-insight-env --interface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Deployment success
        run: |
          echo "✅ Tests passed and deployment to HuggingFace successful!"
          echo "📍 Space URL: https://huggingface.co/spaces/sushere/ux-insight-env"
          echo "🔗 API: https://sushere-ux-insight-env.hf.space"

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment to HuggingFace failed"
          echo "Check logs above for details"
          exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [test, build-docker, deploy]
    if: always()

    steps:
      - name: Build status summary
        run: |
          echo "### GitHub Actions Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Build**: ${{ needs.build-docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ **All checks passed and deployed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "🚀 **Space**: https://huggingface.co/spaces/sushere/ux-insight-env" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pipeline failed - check logs**" >> $GITHUB_STEP_SUMMARY
          fi
