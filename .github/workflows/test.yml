name: Test & Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run pytest
        run: |
          pytest server/tests/test_grader.py -v --tb=short
        continue-on-error: true

      - name: Validate imports
        run: |
          python -c "from server.environment import UXInsightEnvironment; from server.rubrics import UXAnalystRubric; from server.grader import grade_step; print('✓ All imports valid')"

      - name: Check code quality
        run: |
          pip install flake8
          flake8 server/ models.py --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Test Summary
        if: success()
        run: |
          echo "✅ All tests and validations passed"

      - name: Test Failed
        if: failure()
        run: |
          echo "❌ Tests failed - check logs above"
          exit 1
